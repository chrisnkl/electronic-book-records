services:

  postgres:
    image: postgres:17
    container_name: ebr-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ebr
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  ebr-app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ebr-app

    ports:
      - "8080:8080"

    depends_on:
      - postgres

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/ebr
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8081:8080"
      - "50000:50000"

    volumes:
      - "jenkins_home:/var/jenkins_home"

volumes:
  postgres_data:
  jenkins_home: